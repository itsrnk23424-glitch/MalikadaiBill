
name: Build Malikadai Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the app source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Check voice billing
        run: npm run verify

      - name: Compile web screens
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon
        run: npx --yes @capacitor/assets@4.0.0 generate --android

      - name: Sync Android app
        run: npx cap sync android

      - name: Prepare microphone permissions
        run: node scripts/prepare-android-manifest.mjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalikadaiBill-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
